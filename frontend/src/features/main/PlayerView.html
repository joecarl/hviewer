<div class="hv-player" data-cb="playerRoot">

	<div class="hv-player-topbar">
		<button class="ui-btn hv-back-btn" data-cb="backBtn">← Back</button>
		<span class="hv-player-title" data-cb="playerTitle"></span>
		<button class="ui-btn hv-info-toggle" data-cb="infoToggleBtn" title="Stream info">ⓘ</button>
	</div>

	<div class="hv-info-bar" data-cb="infoBar">
		<span class="hv-info-item" data-cb="infoVideo"></span>
		<span class="hv-info-sep">·</span>
		<span class="hv-info-item" data-cb="infoAudio"></span>
		<span class="hv-info-sep">·</span>
		<span class="hv-info-item" data-cb="infoDuration"></span>
	</div>

	<div class="hv-player-status" data-cb="playerStatus"></div>

	<div class="hv-video-container">
		<video class="hv-video" data-cb="videoEl" controls playsinline></video>
	</div>

	<div class="hv-track-area">

		<div class="hv-track-section" data-cb="audioSection">
			<div class="hv-track-label">
				Audio track

			</div>
			<div class="hv-track-buttons" data-cb="audioButtons">
				<button class="ui-btn track-btn" data-cb="audioBtn"></button>
			</div>
			<span class="hv-track-loading" data-cb="audioLoadingIndicator"></span>
		</div>

		<div class="hv-track-section" data-cb="subtitleSection">
			<div class="hv-track-label">Subtitles</div>
			<div class="hv-track-buttons" data-cb="subtitleButtons">
				<button class="ui-btn track-btn" data-cb="subtitleBtn"></button>
			</div>
		</div>

	</div>

</div>
